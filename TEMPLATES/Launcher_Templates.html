<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SOC Launcher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; flex-direction: column; height: 100vh; background: #111; }

  #tab-bar {
    display: flex;
    gap: 4px;
    padding: 3px 6px;
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    height: 26px;
    align-items: center;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 4px 12px;
    border: 1px solid #333;
    border-radius: 4px;
    cursor: pointer;
    color: #999;
    background: #1e1e1e;
    transition: all 0.15s;
    line-height: 1;
  }

  .tab:hover { color: #ccc; border-color: #555; }

  .tab .check {
    display: none;
    font-size: 12px;
  }

  .tab.active {
    color: #7fe20e;
    border-color: #3d5c1a;
    background: #1c2a12;
  }

  .tab.active .check { display: inline; }

  iframe {
    flex: 1;
    border: none;
    display: none;
    width: 100%;
  }

  iframe.active { display: block; }
</style>
</head>
<body>

<div id="tab-bar">
  <button class="tab" onclick="switchTab('mdr')"><span class="check">✓</span>MDR</button>
  <button class="tab" onclick="switchTab('soc')"><span class="check">✓</span>Triage</button>
</div>

<iframe id="frame-mdr" class="active" src="Template_MDR.html"></iframe>
<iframe id="frame-soc" src="Template_L2.html"></iframe>

<script>
  function switchTab(name, skipSave) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
    document.querySelector(`[onclick="switchTab('${name}')"]`).classList.add('active');
    document.getElementById(`frame-${name}`).classList.add('active');
    if (!skipSave) {
      try { localStorage.setItem('launcher-active-tab', name); } catch (e) {}
    }
  }

  // Restaurar la pestaña activa desde localStorage al cargar
  (function initTab() {
    let saved = null;
    try { saved = localStorage.getItem('launcher-active-tab'); } catch (e) {}
    switchTab(saved === 'soc' ? 'soc' : 'mdr', true);
  })();

  // ============================================================
  // Puente de navegación cross-app (postMessage) recibido desde SPEED.html
  // SPEED ya cambió a esta app (Templates) y reenvía el payload original
  // de OSINT. Acá lo re-reenviamos SOLO al template que esté activo en
  // este momento (MDR o L2/SOC); no cambiamos de tab.
  // ============================================================
  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.type !== 'osint-data' || !data.value) return;

    const activeFrame = document.querySelector('iframe.active');
    if (activeFrame && activeFrame.contentWindow) {
      activeFrame.contentWindow.postMessage(data, '*');
    } else {
      console.warn('[Launcher_Templates] No hay iframe activo para reenviar osint-data.');
    }
  });
</script>
</body>
</html>
